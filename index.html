<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’Oréal | Smart Routine & Product Advisor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <img src="img/loreal-logo.png" alt="L’Oréal" width="220">
      <p class="eyebrow">YOUR BEAUTY, YOUR WAY</p>
      <h1>Smart Routine &amp;<br>Product Advisor</h1>
      <p>Discover a little more of what makes you, you.</p>
    </header>
    <main>
      <section class="chatbox" aria-label="Beauty advisor chat">
        <div class="chat-heading"><span>THE BEAUTY CONVERSATION</span><button id="resetBtn" type="button">New chat</button></div>
        <div id="chatWindow" class="chat-window" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
        <div class="suggestions" aria-label="Conversation starters">
          <button type="button">Build a skincare routine</button>
          <button type="button">Help with dry hair</button>
          <button type="button">Find my foundation</button>
        </div>
        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Your beauty question</label>
          <input id="userInput" name="userInput" placeholder="Ask about L’Oréal products or routines…" maxlength="2000" autocomplete="off" required>
          <button type="submit" id="sendBtn" aria-label="Send message">Send ↗</button>
        </form>
        <p id="status" class="status" role="status"></p>
      </section>
    </main>
    <footer>Student project • Not an official L’Oréal service.<br>AI suggestions may be inaccurate. Check product labels.</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
